  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(D.i)},k,bin(D.c)));
}
// 先去掉本页的样式再换成正式页面，免得解锁页的居中布局残留
function run(html){document.querySelectorAll('style').forEach(s=>s.remove());document.open();document.write(html);document.close()}
const f=document.getElementById('f'), msg=document.getElementById('msg');
(async()=>{
  // 不长期记住口令：只有在同一个标签页里刷新时免输，关掉再打开或重新进网址都要重新输入
  if(document.readyState==='loading')await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}));
  try{localStorage.removeItem(KEY)}catch(e){}
  let saved=null,nav='';
  try{saved=sessionStorage.getItem(KEY);nav=(performance.getEntriesByType('navigation')[0]||{}).type||''}catch(e){}
  if(saved&&nav==='reload'){try{return run(await decrypt(bin(saved)))}catch(e){}}
  try{sessionStorage.removeItem(KEY)}catch(e){}
  f.hidden=false;
})();
f.onsubmit=async e=>{
  e.preventDefault();
  const go=document.getElementById('go'), pw=document.getElementById('pw').value;
  if(!pw)return;
  if(!window.crypto||!crypto.subtle){msg.textContent='当前浏览器不支持解锁，请用 https 网址在 Safari 或 Chrome 中打开';return}
  go.disabled=true;msg.textContent='';
  try{
    const raw=await derive(pw), html=await decrypt(raw);
    try{sessionStorage.setItem(KEY,b64(raw))}catch(e){}
    run(html);
  }catch(err){go.disabled=false;msg.textContent='口令不正确'}
};
