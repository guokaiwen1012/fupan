<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>请输入口令</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1c1f24;--sub:#7a808a;--line:#e6e8ec;--pri:#2f6bff;--bad:#e5484d}
@media (prefers-color-scheme:dark){:root{--bg:#111317;--card:#1b1e24;--text:#e9ebef;--sub:#8b919c;--line:#2a2e36;--pri:#6b95ff;--bad:#ff6b6f}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px}
form{width:100%;max-width:340px;background:var(--card);border-radius:16px;padding:24px}
h1{font-size:18px;margin:0 0 16px}
input{width:100%;height:50px;font-size:17px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);outline:none}
input:focus{border-color:var(--pri)}
button{width:100%;height:50px;margin-top:12px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:16px;font-weight:600}
button:disabled{opacity:.6}
label{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--sub)}
label input{width:18px;height:18px}
#msg{min-height:22px;margin-top:10px;font-size:14px;color:var(--bad)}
</style>
</head>
<body>
<form id="f" hidden>
  <h1>请输入口令</h1>
  <input id="pw" type="password" autocomplete="current-password" placeholder="口令" autofocus>
  <button id="go">进入</button>
  <label><input id="keep" type="checkbox" checked>在这台设备上记住，下次不用再输</label>
  <div id="msg"></div>
</form>

const KEY='fupan-unlock';
const bin=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=u=>btoa(String.fromCharCode.apply(null,u));
async function derive(pw){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:bin(D.s),iterations:D.n,hash:'SHA-256'},k,256));
}
async function decrypt(raw){
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(D.i)},k,bin(D.c)));
}
function run(html){document.open();document.write(html);document.close()}
const f=document.getElementById('f'), msg=document.getElementById('msg');
(async()=>{
  // 这台设备上记住过：直接解锁
  let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){try{return run(await decrypt(bin(saved)))}catch(e){try{localStorage.removeItem(KEY)}catch(e){}}}
  f.hidden=false;
})();
f.onsubmit=async e=>{
  e.preventDefault();
  const go=document.getElementById('go'), pw=document.getElementById('pw').value;
  if(!pw)return;
  if(!window.crypto||!crypto.subtle){msg.textContent='当前浏览器不支持解锁，请用 https 网址在 Safari 或 Chrome 中打开';return}
  go.disabled=true;msg.textContent='';
  try{
    const raw=await derive(pw), html=await decrypt(raw);
    if(document.getElementById('keep').checked){try{localStorage.setItem(KEY,b64(raw))}catch(e){}}
    run(html);
  }catch(err){go.disabled=false;msg.textContent='口令不正确'}
};
</script>
